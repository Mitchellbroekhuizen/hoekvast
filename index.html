<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
</head>
<body>
<title>Hoekvast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14161a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: één-scherm camera-tool — sticky kop met modus, tabbladen eronder, camerapaneel schuift volledig over het scherm */
:root{
  --bg:#14161a; --panel:#1c1f25; --line:#2c3038; --fg:#eceae4; --mute:#9a9ea8;
  --tape:#f2c14e; --tape-ink:#1a1608; --ok:#5fc48a; --warn:#e8845a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font:700 28px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font:500 12px var(--f-mono);color:var(--mute)}
.mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.mode button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px 9px;font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--tape)}

main{padding-block:18px 120px}
.car{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.car label{font:500 12px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.car input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--fg);font:500 15px var(--f-mono)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bar{flex:1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--tape) 0 8px,#d9a93a 8px 16px);transition:width .3s}
.progress span{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}

.lede{color:var(--mute);margin:0 0 18px;max-width:62ch}
h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;text-wrap:balance}
h2 small{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.06em;margin-left:8px}

.shot{border-top:1px solid var(--line)}
.shot:last-child{border-bottom:1px solid var(--line)}
.shot summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 2px;cursor:pointer}
.shot summary::-webkit-details-marker{display:none}
.num{font:600 13px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.shot.done .num{color:var(--ok)}
.sname{font-weight:600;min-width:0}
.sname em{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px}
.chip{font:600 11px var(--f-mono);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.lens{border-color:var(--tape);color:var(--tape)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.body{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:4px 2px 18px}
@media (max-width:520px){.body{grid-template-columns:1fr}.chips .chip.h{display:none}}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:180px}
.plan svg{display:block;width:100%;height:auto}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:14px}
.spec dt{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.spec dd{margin:0;min-width:0}
.why{font-size:14px;color:var(--mute);margin:0 0 10px}
.ai{font-size:13px;border-left:3px solid var(--tape);padding:4px 10px;margin:0 0 12px;background:rgba(242,193,78,.06)}
.go{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--tape);color:var(--tape-ink);font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:8px}
.thumb{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--ok);vertical-align:middle;margin-left:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.card p{margin:0 0 8px}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14px}
.kv b{font:600 13px var(--f-mono);color:var(--tape)}
.note{font-size:13px;color:var(--mute)}
.prompt{position:relative;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 12px 40px;font:13px/1.5 var(--f-mono);margin:8px 0}
.prompt button{position:absolute;right:8px;bottom:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px}
.warnbox{border-color:var(--warn)}
.warnbox h3{color:var(--warn)}
.lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.lensc{border:1px solid var(--line);border-radius:10px;padding:10px}
.lensc b{font:700 26px var(--f-display);display:block}
.lensc span{font-size:13px;color:var(--mute)}
.lensc.good{border-color:var(--ok)} .lensc.bad{border-color:var(--warn)}

/* Camera */
#cam{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.vf{position:relative;flex:1;overflow:hidden;background:#000}
.vf video,.vf img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#000c,#0000);display:flex;gap:12px;align-items:flex-start}
.cbar .t{flex:1;min-width:0}
.cbar .t b{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;display:block;color:#fff}
.cbar .t span{font-size:13px;color:#ddd}
.cbar .x{border:1px solid #fff5;background:#0008;color:#fff;border-radius:999px;width:40px;height:40px;flex:none;font-size:20px}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-wrap:wrap;gap:6px}
.hud .chip.warn{color:var(--warn);border-color:var(--warn)}
.prof{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.prof .chip{background:#000a;color:#fff;border-color:#fff4}
.prof .chip.on{color:var(--ok);border-color:var(--ok)}
.prof .chip.off{color:#888;text-decoration:line-through}
.prof button.chip{cursor:pointer;color:var(--tape);border-color:var(--tape)}
.fring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--tape);border-radius:50%;pointer-events:none;transition:transform .3s,opacity .6s}
.lakrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lakrow span{font:500 12px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.zoom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:#000a;padding:5px;border-radius:999px}
.zoom button{border:0;background:none;color:#fff;width:42px;height:42px;border-radius:50%;font:600 13px var(--f-mono)}
.zoom button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.6;transition:none}
.hud .chip{background:#000a;color:#fff;border-color:#fff4}
.hud .chip.lens{color:var(--tape);border-color:var(--tape)}
.level{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:74px;font:600 12px var(--f-mono);background:#000a;color:#fff;padding:4px 8px;border-radius:4px}
.level.ok{color:var(--ok)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#0b0c0e}
.controls .side{display:flex;gap:8px;align-items:center}
.controls .side.r{justify-content:flex-end}
.nav{display:inline-flex;align-items:center;border:1px solid #fff3;background:none;color:#fff;border-radius:8px;padding:8px 12px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:var(--tape);position:relative}
.shutter:active{transform:scale(.95)}
.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nav.ic{font-size:22px;padding:6px 14px}
.nav.app{position:relative;cursor:pointer;white-space:nowrap}
.mini{width:46px;height:46px;border-radius:8px;object-fit:cover;border:2px solid var(--ok)}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:90px 24px 40px;color:#ccc;font-size:14px}
.fallback svg{width:min(100%,520px);height:auto;border:1px dashed #fff3;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#06140c;font-weight:600;padding:8px 14px;border-radius:999px;z-index:30;font-size:14px}

/* Keuring */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plate{flex:1;min-width:0;max-width:220px;background:#f2c14e;color:#14161a;border:2px solid #14161a;outline:1px solid var(--tape);border-radius:6px;padding:8px 12px;font:700 20px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.go.small{font-size:14px;padding:8px 12px;cursor:pointer}
.go[disabled]{opacity:.4}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}
.fact{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fact span{display:block;font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.fact b{display:block;font-weight:600;overflow-wrap:anywhere}
.fact em{display:block;font-style:normal;font-size:12px;margin-top:2px}
.fact.good{border-color:var(--ok)} .fact.warn{border-color:var(--warn)} .fact.bad{border-color:#e5484d}
.fact.warn em{color:var(--warn)} .fact.bad em{color:#ff6b6f}
.vrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.vprev{width:100%;max-width:420px;border-radius:8px;background:#000;margin-bottom:6px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.meas{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.meas span{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.meas input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--fg);font:600 16px var(--f-mono);width:100%}
.meas em{font-style:normal;font-size:12px;color:var(--mute)}
.meas.good{border-color:var(--ok)} .meas.good em{color:var(--ok)}
.meas.warn{border-color:var(--warn)} .meas.warn em{color:var(--warn)}
.meas.bad{border-color:#e5484d} .meas.bad em{color:#ff6b6f}
.dwrap{display:flex;justify-content:center;margin:8px 0 12px}
.dmap{width:100%;max-width:260px;height:auto;cursor:crosshair;touch-action:manipulation}
.dmap .dl{font:600 10px var(--f-mono);fill:var(--mute)}
.dmap .db{fill:#2a2e36;stroke:#9a9ea8;stroke-width:1.5}
.dmap .dg{fill:#14161a;stroke:#3a3f48}
.dmap .dr{fill:#23262d;stroke:#3a3f48}
.dmap .dpl{stroke:#3a3f48;stroke-dasharray:3 3}
.dmap .dw{fill:#0b0c0e}
.dm circle{stroke:#fff;stroke-width:2}
.dm text{font:700 11px var(--f-mono);fill:#fff}
.dm.good circle{fill:#2f8f5b} .dm.warn circle{fill:#d0702f} .dm.bad circle{fill:#d0343a}
.drow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.dn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono);background:#d0702f;color:#fff}
.dn.good{background:#2f8f5b} .dn.bad{background:#d0343a}
.dfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dfields input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--fg);font:inherit;width:100%}
.drow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav.lite{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:6px 10px;font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.stbox{margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:6px;flex-wrap:wrap}
.st button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.st.small button{padding:3px 10px;font-size:12px}
.st button.good[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06140c}
.st button.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1d0d03}
.st button.bad[aria-pressed="true"]{background:#e5484d;border-color:#e5484d;color:#fff}
.snote{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font:inherit;width:100%;resize:vertical}
.num[data-st="ok"]{color:var(--ok)} .num[data-st="let"]{color:var(--warn)} .num[data-st="afk"]{color:#ff6b6f}
.chip.qw{border-color:var(--warn);color:var(--warn)}
.thumb[data-annot]{cursor:pointer}
.gh{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.gh div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gh span{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.gh b{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.igpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.igp{position:relative;display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer}
.igp img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:2px solid var(--line)}
.igp input{position:absolute;top:6px;left:6px;width:20px;height:20px;accent-color:var(--tape)}
.igp input:checked+img{border-color:var(--tape)}
.prompt textarea{width:100%;background:none;border:0;color:var(--fg);font:13px/1.5 var(--f-mono);resize:vertical}
#ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;pointer-events:none}
.cbar .x[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.toast.warn{background:var(--warn);color:#1d0d03}

/* Tekenen */
#annot{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.atools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:#0b0c0e}
.atools button{border:1px solid #fff3;background:none;color:#fff;border-radius:8px;padding:7px 12px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.atools button[aria-pressed="true"]{background:#ff2d2d;border-color:#ff2d2d}
.atools .sp{flex:1}
.atools #asave{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.astage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
#acanvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}

/* Rapport (bewust licht, voor PDF) */
#report{position:fixed;inset:0;z-index:40;background:#e9e7e2;overflow-y:auto;color:#16181c}
.rbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:#14161a;color:#eceae4}
.rbar b{flex:1;font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.rbar button{border:1px solid #fff3;background:none;color:#fff;border-radius:8px;padding:7px 12px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.rbar #rprint{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.rbar .note{color:#9a9ea8;flex-basis:100%}
#rbody{background:#fff;max-width:820px;margin:16px auto;padding:28px max(18px,4vw);font:14px/1.5 var(--f-body);color:#16181c}
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #16181c;padding-bottom:12px;margin-bottom:16px}
.rlogo{font:700 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.rlogo span{color:#b8860b}
.rsub{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:#5b5f68;margin-top:4px}
.rmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.rplate{background:#f2c14e;border:2px solid #16181c;border-radius:4px;padding:2px 8px;font:700 15px var(--f-mono);letter-spacing:.08em}
#rbody h2{font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px;color:#16181c}
#rbody h3{font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:#5b5f68;margin:12px 0 6px}
#rbody .fact{border-color:#d6d3cc} #rbody .fact span{color:#5b5f68}
#rbody .fact.good{border-color:#2f8f5b} #rbody .fact.warn{border-color:#d0702f} #rbody .fact.bad{border-color:#d0343a}
#rbody .fact.warn em{color:#a5501a} #rbody .fact.bad em{color:#b0262b}
.rp{display:inline-block;border:1px solid #c9c6bf;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}

/* ---------- State ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mode=store.get("hv-mode","mb");
let tab="list";
let carName=store.get("hv-car","");
const photos={}; // id -> {url, blob}
let doneIds=new Set(store.get("hv-done",[]));
let camIdx=0, stream=null, levelOn=false, track=null, imgCap=null, zoomCaps=null, curZoom=1;
let camAuto=false, profToken=0, lak=store.get("hv-lak","mid");
const LAK={donker:{l:"Donker",ev:0.3},mid:{l:"Midden",ev:0},licht:{l:"Licht / wit",ev:-0.5}};
const TORCH=new Set(["under","engine","brakes"]);
const SCREEN=new Set(["odo","obd"]);
const PIXEL_ONLY=new Set(["night","roll"]);

/* Camera-instellingen per foto */
function profileFor(s){
  const ev0=LAK[lak]?.ev??0;
  if(SCREEN.has(s.id)) return {iso:null,ev:-0.7,wb:null,torch:false,why:"scherm niet laten uitbranden"};
  if(s.ov==="interior") return {iso:null,ev:0.3,wb:null,torch:false,why:"donker interieur iets lichter"};
  if(["side","front","rear","34f","34r"].includes(s.ov)) return {iso:100,ev:ev0,wb:5500,torch:false,why:"lage ruis op de lak, vaste kleur voor de hele set"};
  return {iso:100,ev:+(ev0/2).toFixed(1),wb:5500,torch:TORCH.has(s.id),why:"detail scherp en ruisvrij"};
}
const fmtEv=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1).replace(".",",");
function profText(s){
  if(PIXEL_ONLY.has(s.id)) return "Gebruik de Pixel-app: lange sluitertijd kan niet in de browser.";
  const p=profileFor(s);
  return [p.iso?`ISO ${p.iso}`:"ISO auto",`belichting ${fmtEv(p.ev)}`,p.wb?`${p.wb} K`:"witbalans auto","scherpte auto (tik om scherp te stellen)",p.torch?"lamp aan":""].filter(Boolean).join(" · ");
}
async function applyProfile(s){
  const box=$("#prof"); if(!box) return;
  if(!track){box.innerHTML="";return}
  const my=++profToken, caps=(track.getCapabilities&&track.getCapabilities())||{}, out=[];
  const tryC=async c=>{try{await track.applyConstraints({advanced:[c]});return true}catch(e){return false}};
  const clamp=(v,r)=>r?Math.min(r.max,Math.max(r.min,v)):v;
  const has=(k,v)=>Array.isArray(caps[k])&&caps[k].includes(v);
  if(camAuto){
    if(has("exposureMode","continuous")) await tryC({exposureMode:"continuous"});
    if(caps.exposureCompensation) await tryC({exposureCompensation:0});
    if(has("whiteBalanceMode","continuous")) await tryC({whiteBalanceMode:"continuous"});
    if(has("focusMode","continuous")) await tryC({focusMode:"continuous"});
    if(caps.torch) await tryC({torch:false});
    if(my===profToken) box.innerHTML=`<button class="chip" id="p-toggle">Camera-auto · tik voor profiel</button>`;
    bindToggle(s); return;
  }
  if(PIXEL_ONLY.has(s.id)){ box.innerHTML=`<span class="chip off">Tip: deze foto met de Pixel-app</span><button class="chip" id="p-toggle">Profiel</button>`; bindToggle(s); return; }
  const p=profileFor(s);
  // scherpte
  if(has("focusMode","continuous")) out.push(["Scherpte auto",await tryC({focusMode:"continuous"})]); else out.push(["Scherpte",false]);
  // belichting
  if(has("exposureMode","continuous")) await tryC({exposureMode:"continuous"});
  if(caps.exposureCompensation){const st=caps.exposureCompensation.step||0.1;const v=Math.round(clamp(p.ev,caps.exposureCompensation)/st)*st;out.push([`EV ${fmtEv(v)}`,await tryC({exposureCompensation:v})])}
  else out.push([`EV ${fmtEv(p.ev)}`,false]);
  // witbalans
  if(p.wb){ if(caps.colorTemperature&&has("whiteBalanceMode","manual")) out.push([`${p.wb} K`,await tryC({whiteBalanceMode:"manual",colorTemperature:clamp(p.wb,caps.colorTemperature)})]); else out.push([`${p.wb} K`,false]); }
  else if(has("whiteBalanceMode","continuous")) await tryC({whiteBalanceMode:"continuous"});
  // lamp
  if(caps.torch) { const ok=await tryC({torch:!!p.torch}); if(p.torch) out.push(["Lamp",ok]); } else if(p.torch) out.push(["Lamp",false]);
  // ISO: eerst automaat laten meten, dan dezelfde helderheid vastzetten met lage ISO
  if(p.iso){
    if(caps.iso&&caps.exposureTime&&has("exposureMode","manual")){
      await new Promise(r=>setTimeout(r,500)); if(my!==profToken) return;
      const st=track.getSettings?track.getSettings():{};
      if(st.iso&&st.exposureTime){
        const maxT=Math.min(caps.exposureTime.max,333); // 1/30 s uit de hand
        let iso=clamp(p.iso,caps.iso), t=st.exposureTime*st.iso/iso*Math.pow(2,p.ev);
        if(t>maxT){ iso=clamp(Math.round(st.iso*st.exposureTime*Math.pow(2,p.ev)/maxT),caps.iso); t=maxT; }
        t=clamp(t,caps.exposureTime);
        out.push([`ISO ${Math.round(iso)}`,await tryC({exposureMode:"manual",iso,exposureTime:t})]);
      } else out.push([`ISO ${p.iso}`,false]);
    } else out.push([`ISO ${p.iso}`,false]);
  }
  if(my!==profToken) return;
  box.innerHTML=out.map(([l,ok])=>`<span class="chip ${ok?"on":"off"}" title="${ok?"ingesteld":"niet ondersteund door de browser"}">${esc(l)}</span>`).join("")+`<button class="chip" id="p-toggle">Auto</button>`;
  bindToggle(s);
}

function tapFocus(e){
  if(!track||e.target.closest("button,label,.cbar,.zoom,.hud")) return;
  const v=$("#video"), r=v.getBoundingClientRect();
  const vw=v.videoWidth||r.width, vh=v.videoHeight||r.height, sc=Math.max(r.width/vw,r.height/vh);
  const dw=vw*sc, dh=vh*sc, ox=(dw-r.width)/2, oy=(dh-r.height)/2;
  const x=Math.min(1,Math.max(0,(e.clientX-r.left+ox)/dw)), y=Math.min(1,Math.max(0,(e.clientY-r.top+oy)/dh));
  const ring=document.createElement("div"); ring.className="fring"; ring.style.left=(e.clientX-r.left)+"px"; ring.style.top=(e.clientY-r.top)+"px";
  $("#vf").appendChild(ring); setTimeout(()=>{ring.style.transform="scale(.7)"},20); setTimeout(()=>{ring.style.opacity=0},700); setTimeout(()=>ring.remove(),1400);
  const caps=(track.getCapabilities&&track.getCapabilities())||{};
  const mode=Array.isArray(caps.focusMode)&&caps.focusMode.includes("single-shot")?"single-shot":"continuous";
  track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}],focusMode:mode}]}).catch(()=>{});
}

function planSVG(s){

    const r=78, rad=(s.a-90)*Math.PI/180; // 0° = boven (voorkant)
    const x=cx+r*Math.cos(rad), y=cy+r*Math.sin(rad);
    const ang=Math.atan2(cy-y,cx-x), sp=.32, L=40;
    const p1=[x+L*Math.cos(ang-sp),y+L*Math.sin(ang-sp)], p2=[x+L*Math.cos(ang+sp),y+L*Math.sin(ang+sp)];
    cam=`<path d="M${x},${y} L${p1} L${p2} Z" fill="rgba(242,193,78,.25)"/><circle cx="${x}" cy="${y}" r="8" fill="#f2c14e"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" font-family="JetBrains Mono,monospace" font-weight="700" fill="#1a1608">${esc(s.lens)}</text>`;

async function openCam(i){

      $("#video").srcObject=stream; $("#fb").hidden=true; $("#file").hidden=true; $("#video").hidden=false;

  if(photos[s.id]) URL.revokeObjectURL(photos[s.id].url);
  photos[s.id]={blob,url:URL.createObjectURL(blob)};
  doneIds.add(s.id); store.set("hv-done",[...doneIds]);
  db.put(s.id,blob);
  showShot();
  makeGhost(blob).then(g=>g&&gdb.put(s.id,g));
  qualityCheck(blob,s).then(flags=>{
    const q=I("q",{}); if(flags.length) q[s.id]=flags; else delete q[s.id]; saveInsp();
    if(flags.length) toast("⚠ "+flags.join(", ")+" · maak hem opnieuw",true); else toast("Opgeslagen ✓");
  });
  if(navigator.vibrate) try{navigator.vibrate(30)}catch(e){}
}
function zoomSteps(){
  if(!zoomCaps) return [];
  return [0.5,1,2,5].filter(z=>z>=zoomCaps.min-0.01&&z<=zoomCaps.max+0.01);
}
function renderZoom(want){
  const el=$("#zoom"), zs=zoomSteps();
  if(!stream||!zs.length){el.hidden=true;return}
  el.hidden=false;
  const target=zs.includes(want)?want:zs.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a);
  setZoom(target);
  el.innerHTML=zs.map(z=>`<button data-z="${z}" aria-pressed="${z===curZoom}">${z}x</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{setZoom(+b.dataset.z);renderZoom(+b.dataset.z);applyProfile(flat()[camIdx])});
}
function setZoom(z){
  curZoom=z;
  if(track) track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
}
function flash(){const f=$("#flash");f.classList.add("on");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("on")))}
async function capture(){

function onTilt(e){
  const el=$("#level");
  const landscape=Math.abs(window.orientation||screen.orientation?.angle||0)===90;
  const deg=landscape?e.beta:e.gamma; if(deg==null) return;
  el.hidden=false; const v=Math.round(deg*10)/10; lastTilt=v;
  el.textContent=Math.abs(v)<1.5?"recht ✓":`scheef ${v>0?"+":""}${v.toFixed(1)}°`;
  el.classList.toggle("ok",Math.abs(v)<1.5);

const RDW_BASE="https://opendata.rdw.nl/resource/";
const normPlate=p=>String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function fmtPlate(p){
  p=normPlate(p);
  const parts=p.match(/[A-Z]+|[0-9]+/g)||[];
  if(parts.length===2&&p.length===6){const a=parts[0],b=parts[1];return a.length===4?a.slice(0,2)+"-"+a.slice(2)+"-"+b:b.length===4?a+"-"+b.slice(0,2)+"-"+b.slice(2):a+"-"+b}
  return parts.join("-");
}
function rdwDate(v){
  if(!v) return null;
  const s=String(v);
  if(/^\d{8}$/.test(s)) return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  const d=new Date(s); return isNaN(d)?null:d;
}
const nlDate=d=>d?d.toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"}):"–";

function rdwFacts(r){
  if(!r) return [];
  const f=[], today=new Date(); today.setHours(0,0,0,0);
  const fuel=(r._fuel||[]).map(x=>x.brandstof_omschrijving).filter(Boolean).join(" + ");
  const kw=Math.max(0,...(r._fuel||[]).map(x=>parseFloat(x.nettomaximumvermogen)||0));
  const add=(l,v,flag)=>{if(v!=null&&v!==""&&v!=="Niet geregistreerd")f.push({l,v:String(v),flag:flag||""})};
  add("Merk / model",[r.merk,r.handelsbenaming].filter(Boolean).join(" "));
  add("Soort",[r.voertuigsoort,r.inrichting].filter(Boolean).join(" · "));
  add("Kleur",[r.eerste_kleur,r.tweede_kleur&&r.tweede_kleur!=="Niet geregistreerd"?r.tweede_kleur:""].filter(Boolean).join(" / "));
  add("Brandstof",fuel);
  if(kw) add("Vermogen",`${Math.round(kw)} kW (${Math.round(kw*1.362)} pk)`);
  if(r.cilinderinhoud) add("Cilinderinhoud",`${r.cilinderinhoud} cc`);
  if(r.massa_ledig_voertuig) add("Leeg gewicht",`${r.massa_ledig_voertuig} kg`);
  const dt=rdwDate(r.datum_eerste_toelating), nl=rdwDate(r.datum_eerste_tenaamstelling_in_nederland);
  add("Eerste toelating",dt?nlDate(dt):null);
  if(nl&&dt&&(nl-dt)>45*864e5) add("Eerste keer in NL",nlDate(nl),"warn:Geïmporteerd: historie uit het buitenland apart opvragen");
  const ten=rdwDate(r.datum_tenaamstelling); if(ten) add("Huidige eigenaar sinds",nlDate(ten));
  const apk=rdwDate(r.vervaldatum_apk);
  if(apk) add("APK geldig tot",nlDate(apk),apk<today?"bad:APK is verlopen":(apk-today)<60*864e5?"warn:APK verloopt binnen 2 maanden":"good:");
  if(r.openstaande_terugroepactie_indicator) add("Openstaande terugroepactie",r.openstaande_terugroepactie_indicator,r.openstaande_terugroepactie_indicator==="Ja"?"bad:Laat de dealer de terugroepactie uitvoeren":"good:");
  if(r.tellerstandoordeel) add("Tellerstandoordeel",r.tellerstandoordeel+(r.jaar_laatste_registratie_tellerstand?` (laatste registratie ${r.jaar_laatste_registratie_tellerstand})`:""),/logisch/i.test(r.tellerstandoordeel)&&!/onlogisch/i.test(r.tellerstandoordeel)?"good:":"warn:Kilometerstand nader controleren");
  if(r.taxi_indicator==="Ja") add("Taxi","Ja","warn:Geweest of nog geregistreerd als taxi");
  if(r.wam_verzekerd) add("WAM-verzekerd",r.wam_verzekerd,r.wam_verzekerd==="Nee"?"warn:":"");
  if(r.catalogusprijs) add("Catalogusprijs",`€ ${Number(r.catalogusprijs).toLocaleString("nl-NL")}`);
  return f;
}

/* ---------- Kwaliteitscheck ---------- */
async function qualityCheck(blob,shot){
  try{
    const bmp=await createImageBitmap(blob);
    const W=480, H=Math.round(bmp.height*W/bmp.width);
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(bmp,0,0,W,H);
    const d=x.getImageData(0,0,W,H).data, g=new Float32Array(W*H);
    let sum=0, hi=0, lo=0;
    for(let i=0,j=0;i<d.length;i+=4,j++){const v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g[j]=v;sum+=v;if(v>250)hi++;if(v<6)lo++}
    const n=W*H, mean=sum/n;
    // scherpte: variantie van de Laplace-operator in het midden (waar de auto staat)
    const x0=Math.floor(W*.2),x1=Math.floor(W*.8),y0=Math.floor(H*.2),y1=Math.floor(H*.8);
    let s1=0,s2=0,m=0;
    for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){const i=yy*W+xx;const L=g[i-1]+g[i+1]+g[i-W]+g[i+W]-4*g[i];s1+=L;s2+=L*L;m++}
    const lapVar=s2/m-(s1/m)*(s1/m);
    const flags=[];
    if(lapVar<45) flags.push("mogelijk onscherp");
    if(hi/n>0.06) flags.push("deels overbelicht");
    if(mean<55&&lo/n>0.15) flags.push("te donker");
    else if(mean>205) flags.push("te licht");
    const ext=shot&&["side","front","rear","34f","34r"].includes(shot.ov);
    if(ext&&lastTilt!=null&&Math.abs(lastTilt)>2) flags.push("scheef");
    return flags;
  }catch(e){return []}
}

let an=null;
function openAnnot(key){
  const src=key.startsWith("dmg:")?media[key]:photos[key]; if(!src) return;
  const box=$("#annot"); box.hidden=false; document.body.style.overflow="hidden";
  const c=$("#acanvas"), img=new Image();
  img.onload=()=>{
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    an={key,img,shapes:[],tool:an?.tool||"arrow",cur:null}; redraw(); markTool();
  };

}
function redraw(){
  const c=$("#acanvas"), x=c.getContext("2d"); x.drawImage(an.img,0,0);
  const lw=Math.max(4,c.width*0.006);
  [...an.shapes,an.cur].filter(Boolean).forEach(s=>{
    x.lineCap="round";x.lineJoin="round";
    for(const [col,w] of [["#ffffff",lw*1.9],["#ff2d2d",lw]]){
      x.strokeStyle=col;x.lineWidth=w;x.beginPath();
      if(s.t==="pen"){s.p.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]))}
      if(s.t==="circle"){const [a,b]=s.p;x.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2+1,Math.abs(b[1]-a[1])/2+1,0,0,Math.PI*2)}
      if(s.t==="arrow"){const [a,b]=s.p;const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),h=lw*6;x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.moveTo(b[0],b[1]);x.lineTo(b[0]-h*Math.cos(ang-.45),b[1]-h*Math.sin(ang-.45));x.moveTo(b[0],b[1]);x.lineTo(b[0]-h*Math.cos(ang+.45),b[1]-h*Math.sin(ang+.45))}
      x.stroke();
    }
  });
}

function canvasPt(e){const c=$("#acanvas"),r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}

/* ---------- Gouden uur ---------- */
function sunElev(t,lat,lon){
  const rad=Math.PI/180, d=(t-Date.UTC(2000,0,1,12))/864e5;
  const g=(357.529+0.98560028*d)*rad, q=280.459+0.98564736*d;
  const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, e=(23.439-0.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)), dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  const ha=(gmst*15+lon)*rad-ra;
  return Math.asin(Math.sin(lat*rad)*Math.sin(dec)+Math.cos(lat*rad)*Math.cos(dec)*Math.cos(ha))/rad;
}
function sunTimes(day,lat,lon){
  const start=new Date(day); start.setHours(0,0,0,0);
  const cross=(lvl,rising)=>{let prev=sunElev(start.getTime(),lat,lon);for(let m=1;m<=1440;m++){const t=start.getTime()+m*6e4,e=sunElev(t,lat,lon);if(rising?(prev<lvl&&e>=lvl):(prev>=lvl&&e<lvl))return new Date(t);prev=e}return null};
  return {rise:cross(-0.833,true),set:cross(-0.833,false),gmS:cross(-4,true),gmE:cross(6,true),geS:cross(6,false),geE:cross(-4,false)};
}
const hm=d=>d?d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):"–";
async function goldenHour(useSaved){
  const out=$("#ghout"); if(!out) return;
  let loc=store.get("hv-loc",null);
  if(!useSaved||!loc){
    out.innerHTML=`<p class="note">Locatie ophalen…</p>`;
    try{loc=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)}),rej,{timeout:10000,maximumAge:6e5}))}
    catch(e){out.innerHTML=`<p class="note">Geen locatie beschikbaar. In de preview is locatie geblokkeerd; in de geïnstalleerde app vraagt hij om toestemming.</p>`;return}
    store.set("hv-loc",loc);
  }
  const now=new Date(); let day=new Date(now), t=sunTimes(day,loc.lat,loc.lon);
  if(t.geE&&now>t.geE){day.setDate(day.getDate()+1);t=sunTimes(day,loc.lat,loc.lon)}
  const isTomorrow=day.getDate()!==now.getDate();
  let clouds=null;
  try{
    const j=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=cloud_cover&timezone=auto&forecast_days=3`).then(r=>r.json());
    clouds=d=>{if(!d)return null;const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:00`;const i=j.hourly.time.indexOf(key);return i>=0?j.hourly.cloud_cover[i]:null};
  }catch(e){}
  const cl=d=>{const c=clouds&&clouds(d);if(c==null)return "";return c<25?`<span class="chip">${c}% bewolkt · zonnig, mooi strijklicht</span>`:c<70?`<span class="chip">${c}% bewolkt · wisselend</span>`:`<span class="chip ok">${c}% bewolkt · zacht licht, ideaal voor advertentie en keuring</span>`};
  out.innerHTML=`<div class="gh">
    <div><span>Ochtend gouden uur${isTomorrow?" (morgen)":""}</span><b>${hm(t.gmS)}–${hm(t.gmE)}</b>${cl(t.gmS)}</div>
    <div><span>Avond gouden uur${isTomorrow?" (morgen)":""}</span><b>${hm(t.geS)}–${hm(t.geE)}</b>${cl(t.geS)}</div>
    <div><span>Zon op / onder</span><b>${hm(t.rise)} / ${hm(t.set)}</b>${cl(new Date())?`<span class="note">Nu: </span>${cl(new Date())}`:""}</div>
   </div><p class="note">Berekend voor jouw locatie. Bewolking via Open-Meteo.</p>`;
}

async function to45(blob,fit){
  const bmp=await createImageBitmap(blob), W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const cover=Math.max(W/bmp.width,H/bmp.height), contain=Math.min(W/bmp.width,H/bmp.height);
  if(fit==="blur"){
    x.filter="blur(40px) brightness(.7)"; const w=bmp.width*cover,h=bmp.height*cover; x.drawImage(bmp,(W-w)/2,(H-h)/2,w,h); x.filter="none";
    const w2=bmp.width*contain,h2=bmp.height*contain; x.drawImage(bmp,(W-w2)/2,(H-h2)/2,w2,h2);
  } else { const w=bmp.width*cover,h=bmp.height*cover; x.drawImage(bmp,(W-w)/2,(H-h)/2,w,h); }
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.93));
}
async function igExport(){
  const msg=$("#igmsg"), sel=I("igsel",{});
  const list=flat().filter(s=>photos[s.id]&&sel[s.id]!==false).slice(0,20);
  if(!list.length){msg.textContent="Kies minstens één foto.";return}
  msg.textContent="Bezig met omzetten…";
  const files=[];
  for(const [i,s] of list.entries()){const b=await to45(photos[s.id].blob,insp.igfit||"crop");files.push(new File([b],`ig_${String(i+1).padStart(2,"0")}_${slug(s.n)}.jpg`,{type:"image/jpeg"}))}
  await shareFiles(files,msg,"Instagram");
}
async function shareFiles(files,msg,title){
  try{ if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title});msg.textContent=`${files.length} bestanden gedeeld.`;return} }catch(e){ if(e.name==="AbortError"){msg.textContent="";return} }
  try{ files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()},i*350)); msg.textContent=`${files.length} bestanden worden gedownload.`; }
  catch(e){ msg.textContent="Opslaan lukt niet in deze preview; in de geïnstalleerde app wel."; }
}

/* ---------- Foto's bewaren op het toestel (IndexedDB) ---------- */
const makeStore=NAME=>{
  let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open(NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(m,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction("photos",m);const st=t.objectStore("photos");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})).catch(()=>null);
  return{
    put:(k,v)=>tx("readwrite",st=>st.put(v,k)),
    get:k=>tx("readonly",st=>st.get(k)),
    clear:()=>tx("readwrite",st=>st.clear()),
    load:()=>open().then(d=>new Promise(res=>{const out={};const t=d.transaction("photos");const c=t.objectStore("photos").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>res(out)})).catch(()=>({}))
  };
};
const db=makeStore("hoekvast"), gdb=makeStore("hoekvast-ghost");

render();
db.load().then(saved=>{
  let n=0;
  for(const [k,b] of Object.entries(saved||{})){ if(!(b instanceof Blob)||k.startsWith("orig:")) continue; if(k.startsWith("vid:")||k.startsWith("dmg:")){media[k]={blob:b,url:URL.createObjectURL(b)};n++;continue} photos[k]={blob:b,url:URL.createObjectURL(b)};doneIds.add(k);n++ }
  if(n){store.set("hv-done",[...doneIds]);render()}
});
