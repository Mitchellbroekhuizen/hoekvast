<title>Hoekvast</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: één-scherm camera-tool — sticky kop met modus, tabbladen eronder, camerapaneel schuift volledig over het scherm */
:root{
  --bg:#14161a; --panel:#1c1f25; --line:#2c3038; --fg:#eceae4; --mute:#9a9ea8;
  --tape:#f2c14e; --tape-ink:#1a1608; --ok:#5fc48a; --warn:#e8845a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font:700 28px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font:500 12px var(--f-mono);color:var(--mute)}
.mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.mode button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px 9px;font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--tape)}

main{padding-block:18px 120px}
.car{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.car label{font:500 12px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.car input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--fg);font:500 15px var(--f-mono)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bar{flex:1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--tape) 0 8px,#d9a93a 8px 16px);transition:width .3s}
.progress span{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}

.lede{color:var(--mute);margin:0 0 18px;max-width:62ch}
h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;text-wrap:balance}
h2 small{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.06em;margin-left:8px}

.shot{border-top:1px solid var(--line)}
.shot:last-child{border-bottom:1px solid var(--line)}
.shot summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 2px;cursor:pointer}
.shot summary::-webkit-details-marker{display:none}
.num{font:600 13px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.shot.done .num{color:var(--ok)}
.sname{font-weight:600;min-width:0}
.sname em{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px}
.chip{font:600 11px var(--f-mono);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.lens{border-color:var(--tape);color:var(--tape)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.body{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:4px 2px 18px}
@media (max-width:520px){.body{grid-template-columns:1fr}.chips .chip.h{display:none}}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:180px}
.plan svg{display:block;width:100%;height:auto}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:14px}
.spec dt{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.spec dd{margin:0;min-width:0}
.why{font-size:14px;color:var(--mute);margin:0 0 10px}
.ai{font-size:13px;border-left:3px solid var(--tape);padding:4px 10px;margin:0 0 12px;background:rgba(242,193,78,.06)}
.go{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--tape);color:var(--tape-ink);font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:8px}
.thumb{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--ok);vertical-align:middle;margin-left:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.card p{margin:0 0 8px}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14px}
.kv b{font:600 13px var(--f-mono);color:var(--tape)}
.note{font-size:13px;color:var(--mute)}
.prompt{position:relative;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 12px 40px;font:13px/1.5 var(--f-mono);margin:8px 0}
.prompt button{position:absolute;right:8px;bottom:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px}
.warnbox{border-color:var(--warn)}
.warnbox h3{color:var(--warn)}
.lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.lensc{border:1px solid var(--line);border-radius:10px;padding:10px}
.lensc b{font:700 26px var(--f-display);display:block}
.lensc span{font-size:13px;color:var(--mute)}
.lensc.good{border-color:var(--ok)} .lensc.bad{border-color:var(--warn)}

/* Camera */
#cam{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.vf{position:relative;flex:1;overflow:hidden;background:#000}
.vf video,.vf img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#000c,#0000);display:flex;gap:12px;align-items:flex-start}
.cbar .t{flex:1;min-width:0}
.cbar .t b{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;display:block;color:#fff}
.cbar .t span{font-size:13px;color:#ddd}
.cbar .x{border:1px solid #fff5;background:#0008;color:#fff;border-radius:999px;width:40px;height:40px;flex:none;font-size:20px}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-wrap:wrap;gap:6px}
.hud .chip.warn{color:var(--warn);border-color:var(--warn)}
.prof{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.prof .chip{background:#000a;color:#fff;border-color:#fff4}
.prof .chip.on{color:var(--ok);border-color:var(--ok)}
.prof .chip.off{color:#888;text-decoration:line-through}
.prof button.chip{cursor:pointer;color:var(--tape);border-color:var(--tape)}
.fring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--tape);border-radius:50%;pointer-events:none;transition:transform .3s,opacity .6s}
.lakrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lakrow span{font:500 12px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.zoom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:#000a;padding:5px;border-radius:999px}
.zoom button{border:0;background:none;color:#fff;width:42px;height:42px;border-radius:50%;font:600 13px var(--f-mono)}
.zoom button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.6;transition:none}
.hud .chip{background:#000a;color:#fff;border-color:#fff4}
.hud .chip.lens{color:var(--tape);border-color:var(--tape)}
.level{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:74px;font:600 12px var(--f-mono);background:#000a;color:#fff;padding:4px 8px;border-radius:4px}
.level.ok{color:var(--ok)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#0b0c0e}
.controls .side{display:flex;gap:8px;align-items:center}
.controls .side.r{justify-content:flex-end}
.nav{display:inline-flex;align-items:center;border:1px solid #fff3;background:none;color:#fff;border-radius:8px;padding:8px 12px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:var(--tape);position:relative}
.shutter:active{transform:scale(.95)}
.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nav.ic{font-size:22px;padding:6px 14px}
.nav.app{position:relative;cursor:pointer;white-space:nowrap}
.mini{width:46px;height:46px;border-radius:8px;object-fit:cover;border:2px solid var(--ok)}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:90px 24px 40px;color:#ccc;font-size:14px}
.fallback svg{width:min(100%,520px);height:auto;border:1px dashed #fff3;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#06140c;font-weight:600;padding:8px 14px;border-radius:999px;z-index:30;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="head">
      <div class="brand"><b>Hoekvast</b><span>pixel 10 pro</span></div>
      <div class="mode" role="group" aria-label="Modus">
        <button id="m-mb" aria-pressed="true">MB Autoadvies</button>
        <button id="m-own" aria-pressed="false">Eigen shoot</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="list" aria-selected="true">Shotlist</button>
      <button role="tab" data-tab="pixel" aria-selected="false">Pixel-instellingen</button>
      <button role="tab" data-tab="light" aria-selected="false">Licht &amp; plek</button>
      <button role="tab" data-tab="ai" aria-selected="false">AI-bewerking</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<section id="cam" hidden aria-label="Camera">
  <div class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <img class="still" id="still" alt="" hidden>
    <svg class="ov" id="ov" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="fallback" id="fb" hidden></div>
    <div class="cbar">
      <div class="t"><b id="c-name"></b><span id="c-how"></span></div>
      <button class="x" id="c-close" aria-label="Sluit camera">×</button>
    </div>
    <div class="hud" id="hud"></div>
    <div class="level" id="level" hidden></div>
    <div class="zoom" id="zoom" hidden></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="controls">
    <div class="side"><button class="nav ic" id="c-prev" aria-label="Vorige foto">‹</button><label class="nav app" id="c-app" title="Beste kwaliteit: maak de foto met Pixel Camera">Pixel-app<input type="file" id="file2" accept="image/*" capture="environment" hidden></label></div>
    <label class="shutter" id="shutter" role="button" tabindex="0" aria-label="Foto maken"><input type="file" id="file" accept="image/*" capture="environment" hidden></label>
    <div class="side r"><img class="mini" id="mini" alt="" hidden><button class="nav ic" id="c-next" aria-label="Volgende foto">›</button></div>
  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script>

const LAK={donker:{l:"Donker",ev:0.3},mid:{l:"Midden",ev:0},licht:{l:"Licht / wit",ev:-0.5}};

const SCREEN=new Set(["odo","obd"]);

/* Camera-instellingen per foto */
function profileFor(s){
  const ev0=LAK[lak]?.ev??0;
  if(SCREEN.has(s.id)) return {iso:null,ev:-0.7,wb:null,torch:false,why:"scherm niet laten uitbranden"};
  if(s.ov==="interior") return {iso:null,ev:0.3,wb:null,torch:false,why:"donker interieur iets lichter"};
  if(["side","front","rear","34f","34r"].includes(s.ov)) return {iso:100,ev:ev0,wb:5500,torch:false,why:"lage ruis op de lak, vaste kleur voor de hele set"};
  return {iso:100,ev:+(ev0/2).toFixed(1),wb:5500,torch:TORCH.has(s.id),why:"detail scherp en ruisvrij"};
}
const fmtEv=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1).replace(".",",");
function profText(s){
  if(PIXEL_ONLY.has(s.id)) return "Gebruik de Pixel-app: lange sluitertijd kan niet in de browser.";
  const p=profileFor(s);
  return [p.iso?`ISO ${p.iso}`:"ISO auto",`belichting ${fmtEv(p.ev)}`,p.wb?`${p.wb} K`:"witbalans auto","scherpte auto (tik om scherp te stellen)",p.torch?"lamp aan":""].filter(Boolean).join(" · ");
}
async function applyProfile(s){
  const box=$("#prof"); if(!box) return;
  if(!track){box.innerHTML="";return}
  const my=++profToken, caps=(track.getCapabilities&&track.getCapabilities())||{}, out=[];
  const tryC=async c=>{try{await track.applyConstraints({advanced:[c]});return true}catch(e){return false}};
  const clamp=(v,r)=>r?Math.min(r.max,Math.max(r.min,v)):v;
  const has=(k,v)=>Array.isArray(caps[k])&&caps[k].includes(v);
  if(camAuto){
    if(has("exposureMode","continuous")) await tryC({exposureMode:"continuous"});
    if(caps.exposureCompensation) await tryC({exposureCompensation:0});
    if(has("whiteBalanceMode","continuous")) await tryC({whiteBalanceMode:"continuous"});
    if(has("focusMode","continuous")) await tryC({focusMode:"continuous"});
    if(caps.torch) await tryC({torch:false});
    if(my===profToken) box.innerHTML=`<button class="chip" id="p-toggle">Camera-auto · tik voor profiel</button>`;
    bindToggle(s); return;
  }
  if(PIXEL_ONLY.has(s.id)){ box.innerHTML=`<span class="chip off">Tip: deze foto met de Pixel-app</span><button class="chip" id="p-toggle">Profiel</button>`; bindToggle(s); return; }
  const p=profileFor(s);
  // scherpte
  if(has("focusMode","continuous")) out.push(["Scherpte auto",await tryC({focusMode:"continuous"})]); else out.push(["Scherpte",false]);
  // belichting
  if(has("exposureMode","continuous")) await tryC({exposureMode:"continuous"});
  if(caps.exposureCompensation){const st=caps.exposureCompensation.step||0.1;const v=Math.round(clamp(p.ev,caps.exposureCompensation)/st)*st;out.push([`EV ${fmtEv(v)}`,await tryC({exposureCompensation:v})])}
  else out.push([`EV ${fmtEv(p.ev)}`,false]);
  // witbalans
  if(p.wb){ if(caps.colorTemperature&&has("whiteBalanceMode","manual")) out.push([`${p.wb} K`,await tryC({whiteBalanceMode:"manual",colorTemperature:clamp(p.wb,caps.colorTemperature)})]); else out.push([`${p.wb} K`,false]); }
  else if(has("whiteBalanceMode","continuous")) await tryC({whiteBalanceMode:"continuous"});
  // lamp
  if(caps.torch) { const ok=await tryC({torch:!!p.torch}); if(p.torch) out.push(["Lamp",ok]); } else if(p.torch) out.push(["Lamp",false]);
  // ISO: eerst automaat laten meten, dan dezelfde helderheid vastzetten met lage ISO
  if(p.iso){
    if(caps.iso&&caps.exposureTime&&has("exposureMode","manual")){
      await new Promise(r=>setTimeout(r,500)); if(my!==profToken) return;
      const st=track.getSettings?track.getSettings():{};
      if(st.iso&&st.exposureTime){
        const maxT=Math.min(caps.exposureTime.max,333); // 1/30 s uit de hand
        let iso=clamp(p.iso,caps.iso), t=st.exposureTime*st.iso/iso*Math.pow(2,p.ev);
        if(t>maxT){ iso=clamp(Math.round(st.iso*st.exposureTime*Math.pow(2,p.ev)/maxT),caps.iso); t=maxT; }
        t=clamp(t,caps.exposureTime);
        out.push([`ISO ${Math.round(iso)}`,await tryC({exposureMode:"manual",iso,exposureTime:t})]);
      } else out.push([`ISO ${p.iso}`,false]);
    } else out.push([`ISO ${p.iso}`,false]);
  }
  if(my!==profToken) return;
  box.innerHTML=out.map(([l,ok])=>`<span class="chip ${ok?"on":"off"}" title="${ok?"ingesteld":"niet ondersteund door de browser"}">${esc(l)}</span>`).join("")+`<button class="chip" id="p-toggle">Auto</button>`;
  bindToggle(s);
}
function bindToggle(s){const b=$("#p-toggle");if(b)b.onclick=()=>{camAuto=!camAuto;applyProfile(s)}}
function tapFocus(e){
  if(!track||e.target.closest("button,label,.cbar,.zoom,.hud")) return;
  const v=$("#video"), r=v.getBoundingClientRect();
  const vw=v.videoWidth||r.width, vh=v.videoHeight||r.height, sc=Math.max(r.width/vw,r.height/vh);
  const dw=vw*sc, dh=vh*sc, ox=(dw-r.width)/2, oy=(dh-r.height)/2;
  const x=Math.min(1,Math.max(0,(e.clientX-r.left+ox)/dw)), y=Math.min(1,Math.max(0,(e.clientY-r.top+oy)/dh));
  const ring=document.createElement("div"); ring.className="fring"; ring.style.left=(e.clientX-r.left)+"px"; ring.style.top=(e.clientY-r.top)+"px";
  $("#vf").appendChild(ring); setTimeout(()=>{ring.style.transform="scale(.7)"},20); setTimeout(()=>{ring.style.opacity=0},700); setTimeout(()=>ring.remove(),1400);
  const caps=(track.getCapabilities&&track.getCapabilities())||{};
  const mode=Array.isArray(caps.focusMode)&&caps.focusMode.includes("single-shot")?"single-shot":"continuous";
  track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}],focusMode:mode}]}).catch(()=>{});
}

function planSVG(s){
  const cx=90,cy=100;
  let cam="";
  if(s.a>=0 && s.d>0){
    const r=78, rad=(s.a-90)*Math.PI/180; // 0° = boven (voorkant)
    const x=cx+r*Math.cos(rad), y=cy+r*Math.sin(rad);
    const ang=Math.atan2(cy-y,cx-x), sp=.32, L=40;
    const p1=[x+L*Math.cos(ang-sp),y+L*Math.sin(ang-sp)], p2=[x+L*Math.cos(ang+sp),y+L*Math.sin(ang+sp)];
    cam=`<path d="M${x},${y} L${p1} L${p2} Z" fill="rgba(242,193,78,.25)"/><circle cx="${x}" cy="${y}" r="8" fill="#f2c14e"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" font-family="JetBrains Mono,monospace" font-weight="700" fill="#1a1608">${esc(s.lens)}</text>`;
  } else if(s.a>=0){
    const r=40, rad=(s.a-90)*Math.PI/180, x=cx+r*Math.cos(rad), y=cy+r*Math.sin(rad);
    cam=`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="#f2c14e" stroke-width="2" stroke-dasharray="3 3"/><circle cx="${x}" cy="${y}" r="4" fill="#f2c14e"/>`;
  }
  return `<svg viewBox="0 0 180 200" role="img" aria-label="Positie rond de auto">
   <circle cx="${cx}" cy="${cy}" r="78" fill="none" stroke="#2c3038" stroke-dasharray="2 5"/>
   <rect x="68" y="58" width="44" height="84" rx="14" fill="#2a2e36" stroke="#9a9ea8" stroke-width="1.5"/>
   <rect x="73" y="74" width="34" height="16" rx="4" fill="#14161a"/><rect x="73" y="114" width="34" height="12" rx="4" fill="#14161a"/>
   <text x="${cx}" y="52" text-anchor="middle" font-size="9" fill="#9a9ea8" font-family="JetBrains Mono,monospace">VOOR</text>
   <text x="${cx}" y="155" text-anchor="middle" font-size="9" fill="#9a9ea8" font-family="JetBrains Mono,monospace">ACHTER</text>
   <text x="30" y="${cy+3}" text-anchor="middle" font-size="9" fill="#9a9ea8" font-family="JetBrains Mono,monospace">L</text>
   <text x="150" y="${cy+3}" text-anchor="middle" font-size="9" fill="#9a9ea8" font-family="JetBrains Mono,monospace">R</text>
   ${cam}
   <text x="${cx}" y="194" text-anchor="middle" font-size="10" fill="#eceae4" font-family="JetBrains Mono,monospace">${s.d>0?`± ${s.d} m`:(s.a>=0?"close-up":"binnen / los")}</text>
  </svg>`;
}

 <div class="card"><div class="kv">
  <b>ISO</b><span>Zo laag als het kan (50–100 overdag). Hoge ISO geeft ruis op de lak.</span>
  <b>Belichting</b><span>Donkere lak: +0,3. Witte/zilveren lak: −0,3 tot −0,7 zodat de lak niet uitbrandt.</span>
  <b>Schaduwen</b><span>Iets omhoog bij interieur en velgen, zodat donkere delen detail houden.</span>
  <b>Witbalans</b><span>Vast zetten (bijv. 5500 K bij bewolking) zodat alle foto's van één auto dezelfde kleur hebben.</span>
  <b>Scherpte</b><span>Handmatig bij remschijven en door ruiten: focus-peaking laat zien wat scherp is.</span>
  <b>Sluitertijd</b><span>Rolling shot 1/30–1/60 s. Statief bij nacht: lang. Overdag laat je hem automatisch.</span>
 </div></div>
 <h2>Automatisch in de app-camera</h2>
 <div class="card"><p>Met de gele knop zet Hoekvast per foto zelf de camera klaar: lage ISO, belichting afgestemd op de lakkleur, vaste witbalans voor de hele set, lamp aan bij motorruimte en remmen. Tik in de zoeker om scherp te stellen.</p>
 <p class="note">In de zoeker zie je welke instellingen gelukt zijn (groen) en welke je telefoon via de browser niet toestaat (doorgestreept). Met <b>Auto</b> schakel je terug naar de automatische stand. De Pixel-app kan een web-app niet vooraf instellen; daar stel je het zelf in met de tabel hierboven.</p></div>
 <div class="card"><h3>Camera Coach</h3><p>De Pixel 10 Pro heeft Camera Coach (Gemini) die tips geeft over kader en hoek. Handig als tweede check, maar de shotlist hier is leidend zodat elke set hetzelfde wordt.</p></div>`}
function lightView(){return `
 <p class="lede">Licht bepaalt 80% van het resultaat. Een goede plek scheelt meer dan elke bewerking.</p>
 <div class="card"><h3>Beste licht</h3><ul>
  <li><b>Bewolkt</b> is ideaal voor advertenties en keuringen: zacht licht, geen harde reflecties, schade goed zichtbaar.</li>
  <li><b>Gouden uur</b> (uur na zonsopkomst / voor zonsondergang) voor je eigen shoot: warme kleuren, lange zachte schaduwen.</li>
  <li><b>Middagzon vermijden</b>: harde reflecties op motorkap en dak, donkere schaduwen onder de auto.</li>
  <li>Moet het in de zon: zet de zon <b>achter jou of opzij</b>, nooit in het beeld.</li>
 </ul></div>
 <div class="card"><h3>Plek kiezen</h3><ul>
  <li>Rustige achtergrond: lege parkeerplaats, bedrijventerrein, egale muur.</li>
  <li>Niets wat uit het dak lijkt te groeien (lantaarnpaal, boom).</li>
  <li>Kijk naar de <b>reflectie in de lak</b>: een rij huizen of andere auto's spiegelt mee. Draai de auto tot de flank een egale lucht of muur weerspiegelt.</li>
  <li>Minimaal 8 m vrije ruimte rondom voor 2x, 12–15 m voor 5x.</li>
 </ul></div>
 <div class="card"><h3>Auto klaarzetten</h3><ul>
  <li>Gewassen en droog, ruiten schoon, banden zwart.</li>
  <li>Kentekenplaat recht, spiegels uitgeklapt, ruiten dicht.</li>
  <li>Interieur leeg: geen telefoonhouder, flesjes, parkeerschijf.</li>
  <li>Stuur bij ¾-foto's iets ingedraaid zodat de velg naar de camera wijst.</li>
 </ul></div>`}
function aiView(){
  const p1="Vervang alleen de achtergrond door een strakke lichtgrijze studio met een zachte reflectie op de vloer. Houd de auto exact zoals hij is: zelfde lak, velgen, kenteken, schade en verhoudingen. Pas geen vormen aan.";
  const p2="Maak de belichting gelijkmatiger: haal harde reflecties van de lak iets weg, licht de schaduwen onder de auto iets op en maak de kleuren natuurlijk. Verander niets aan de auto zelf.";
  const p3="Geef deze foto een filmische avondlook met warme highlights en koele schaduwen, licht verhoogd contrast, voor Instagram in 4:5.";
  return `
 <p class="lede">AI-bewerking werkt alleen goed als de foto er klaar voor is. Hoe consistenter je schiet, hoe beter de AI het resultaat krijgt.</p>
 <div class="card"><h3>Zo schiet je voor AI</h3><ul>
  <li>Hele auto in beeld met <b>10% marge</b>. Afgesneden wielen kan AI niet netjes aanvullen.</li>
  <li>Niets dat de auto raakt of ervoor staat: mensen, borden, paaltjes.</li>
  <li>Zelfde afstand, hoogte en lens voor de hele set. Dan krijgen alle foto's na vervanging dezelfde vloerlijn.</li>
  <li>Bewolkt licht. Zachte reflecties zijn makkelijker te verbeteren dan harde zonvlekken.</li>
  <li>RAW + JPEG bij je eigen shoot, zodat je eerst zelf belichting kunt corrigeren.</li>
 </ul></div>
 <div class="card warnbox"><h3>Keuringsfoto's: niet laten bewerken</h3><p>Voor MB Autoadvies moeten de technische en schadefoto's onbewerkt blijven. AI mag de achtergrond van de advertentieset aanpassen, maar nooit krassen, deuken, bandenslijtage of lampjes wegwerken. Vermeld in je rapport als een foto bewerkt is.</p></div>
 <h2>Prompts om te kopiëren</h2>
 <p class="note">Werkt in Google Foto's (Bewerken → Help me bewerken) en in Gemini.</p>
 <div class="card"><h3>Studio-achtergrond</h3><div class="prompt"><span>${esc(p1)}</span><button data-copy="${esc(p1)}">Kopiëren</button></div></div>
 <div class="card"><h3>Licht egaliseren</h3><div class="prompt"><span>${esc(p2)}</span><button data-copy="${esc(p2)}">Kopiëren</button></div></div>
 <div class="card"><h3>Eigen shoot, sfeer</h3><div class="prompt"><span>${esc(p3)}</span><button data-copy="${esc(p3)}">Kopiëren</button></div></div>`}

function bindMain(){
  const ci=$("#carname"); if(ci) ci.oninput=e=>{carName=e.target.value;store.set("hv-car",carName)};
  document.querySelectorAll("[data-shoot]").forEach(b=>b.onclick=()=>openCam(+b.dataset.shoot));
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.copy;
    navigator.clipboard?.writeText(t).then(()=>{b.textContent="Gekopieerd"},()=>selectText(b.previousElementSibling));
  });
  document.querySelectorAll("[data-lak]").forEach(b=>b.onclick=()=>{lak=b.dataset.lak;store.set("hv-lak",lak);render()});
  const ex=$("#export"); if(ex) ex.onclick=exportAll;
  const rs=$("#reset"); if(rs) rs.onclick=()=>{
    if(rs.dataset.sure){doneIds=new Set();store.set("hv-done",[]);Object.keys(photos).forEach(k=>{URL.revokeObjectURL(photos[k].url);delete photos[k]});db.clear();carName="";store.set("hv-car","");render()}
    else{rs.dataset.sure=1;rs.textContent="Zeker? Tik nogmaals"}
  };
}
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* ---------- Camera ---------- */
async function openCam(i){
  camIdx=i; $("#cam").hidden=false; document.body.style.overflow="hidden";
  showShot();
  if(!stream){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160}},audio:false});
      $("#video").srcObject=stream; $("#fb").hidden=true; $("#file").hidden=true; $("#video").hidden=false;
      track=stream.getVideoTracks()[0];
      try{const c=track.getCapabilities?track.getCapabilities():{}; zoomCaps=c.zoom||null}catch(e){zoomCaps=null}
      try{imgCap=("ImageCapture" in window)?new ImageCapture(track):null}catch(e){imgCap=null}
      showShot();
    }catch(e){ useFallback(); }
  }
  startLevel();
}
function useFallback(){
  $("#video").hidden=true; $("#file").hidden=false; $("#fb").hidden=false;
}
function showShot(){
  const s=flat()[camIdx];
  $("#c-name").textContent=`${camIdx+1}. ${s.n}`;
  $("#c-how").textContent=s.how;
  $("#ov").innerHTML=overlay(s.ov);
  const want=parseFloat(s.lens), zs=zoomSteps();
  const can=!stream||!zs.length||zs.includes(want);
  $("#hud").innerHTML=`<span class="chip lens">${esc(s.lens)}</span><span class="chip">${esc(s.h)}</span>${s.d>0?`<span class="chip">± ${s.d} m</span>`:""}${!can?`<span class="chip warn">${esc(s.lens)} niet in browser: gebruik Pixel-app</span>`:""}`;
  renderZoom(want);
  $("#hud").insertAdjacentHTML("beforeend",'<div class="prof" id="prof"></div>');
  applyProfile(s);
  $("#fb").innerHTML=`<svg viewBox="0 0 1600 900" style="background:#111">${overlay(s.ov)}</svg><p>Live zoeker is hier niet beschikbaar. Kijk naar het kader hierboven en tik op de gele knop of op Pixel-app om de foto te maken.<br>Op GitHub Pages krijg je de live zoeker met kader en zoomknoppen.</p>`;
  const p=photos[s.id]; const mini=$("#mini"); mini.hidden=!p; if(p) mini.src=p.url;
  $("#c-prev").disabled=camIdx===0; $("#c-next").textContent=camIdx===flat().length-1?"✓":"›";
}
function closeCam(){
  $("#cam").hidden=true; document.body.style.overflow="";
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null;imgCap=null;zoomCaps=null}
  render();
}
function savePhoto(blob){
  const s=flat()[camIdx];
  if(photos[s.id]) URL.revokeObjectURL(photos[s.id].url);
  photos[s.id]={blob,url:URL.createObjectURL(blob)};
  doneIds.add(s.id); store.set("hv-done",[...doneIds]);
  db.put(s.id,blob);
  toast("Opgeslagen ✓"); showShot();
  if(navigator.vibrate) try{navigator.vibrate(30)}catch(e){}
}
function zoomSteps(){
  if(!zoomCaps) return [];
  return [0.5,1,2,5].filter(z=>z>=zoomCaps.min-0.01&&z<=zoomCaps.max+0.01);
}
function renderZoom(want){
  const el=$("#zoom"), zs=zoomSteps();
  if(!stream||!zs.length){el.hidden=true;return}
  el.hidden=false;
  const target=zs.includes(want)?want:zs.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a);
  setZoom(target);
  el.innerHTML=zs.map(z=>`<button data-z="${z}" aria-pressed="${z===curZoom}">${z}x</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{setZoom(+b.dataset.z);renderZoom(+b.dataset.z);applyProfile(flat()[camIdx])});
}
function setZoom(z){
  curZoom=z;
  if(track) track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
}
function flash(){const f=$("#flash");f.classList.add("on");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("on")))}
async function capture(){
  const v=$("#video"); if(!stream||!v.videoWidth) return;
  flash();
  if(imgCap){
    try{const b=await imgCap.takePhoto(); if(b&&b.size){savePhoto(b);return}}catch(e){}
  }
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  c.toBlob(b=>b&&savePhoto(b),"image/jpeg",.92);
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1400)}

/* Waterpas via kantelsensor (werkt na plaatsen op GitHub, niet in elke preview) */
function onTilt(e){
  const el=$("#level");
  const landscape=Math.abs(window.orientation||screen.orientation?.angle||0)===90;
  const deg=landscape?e.beta:e.gamma; if(deg==null) return;
  el.hidden=false; const v=Math.round(deg*10)/10;
  el.textContent=Math.abs(v)<1.5?"recht ✓":`scheef ${v>0?"+":""}${v.toFixed(1)}°`;
  el.classList.toggle("ok",Math.abs(v)<1.5);
}
function startLevel(){ if(levelOn) return; try{window.addEventListener("deviceorientation",onTilt);levelOn=true}catch(e){} }

/* ---------- Export ---------- */
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
async function exportAll(){
  const msg=$("#exportmsg"); const all=flat();
  const files=all.map((s,i)=>photos[s.id]?new File([photos[s.id].blob],`${slug(carName||"auto")}_${String(i+1).padStart(2,"0")}_${slug(s.n)}.jpg`,{type:"image/jpeg"}):null).filter(Boolean);
  if(!files.length){msg.textContent="Nog geen foto's in deze sessie.";return}
  try{
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:carName||"Autofoto's"});msg.textContent=`${files.length} foto's gedeeld.`;return}
  }catch(e){ if(e.name==="AbortError") return; }
  try{
    files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()},i*350));
    msg.textContent=`${files.length} foto's worden gedownload. Werkt dit niet in deze preview, dan wel na plaatsen op GitHub.`;
  }catch(e){msg.textContent="Opslaan lukt niet in deze preview; na plaatsen op GitHub wel."}
}

/* ---------- Events ---------- */
$("#m-mb").onclick=()=>{mode="mb";store.set("hv-mode",mode);render()};
$("#m-own").onclick=()=>{mode="own";store.set("hv-mode",mode);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
$("#c-close").onclick=closeCam;
$("#vf").addEventListener("click",tapFocus);
$("#c-prev").onclick=()=>{if(camIdx>0){camIdx--;showShot()}};
$("#c-next").onclick=()=>{if(camIdx<flat().length-1){camIdx++;showShot()}else closeCam()};
$("#shutter").onclick=e=>{ if(stream){e.preventDefault();capture()} };
$("#file").onchange=e=>{const f=e.target.files[0]; if(f) savePhoto(f); e.target.value=""};
$("#file2").onchange=e=>{const f=e.target.files[0]; if(f) savePhoto(f); e.target.value=""};
document.addEventListener("keydown",e=>{if(!$("#cam").hidden&&e.key==="Escape")closeCam()});

/* ---------- Foto's bewaren op het toestel (IndexedDB) ---------- */
const db=(()=>{
  let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("hoekvast",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(m,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction("photos",m);const st=t.objectStore("photos");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})).catch(()=>null);
  return{
    put:(k,v)=>tx("readwrite",st=>st.put(v,k)),
    clear:()=>tx("readwrite",st=>st.clear()),
    load:()=>open().then(d=>new Promise(res=>{const out={};const t=d.transaction("photos");const c=t.objectStore("photos").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>res(out)})).catch(()=>({}))
  };
})();

render();
db.load().then(saved=>{
  let n=0;
  for(const [k,b] of Object.entries(saved||{})){ if(b instanceof Blob){photos[k]={blob:b,url:URL.createObjectURL(b)};doneIds.add(k);n++} }
  if(n){store.set("hv-done",[...doneIds]);render()}
});

/* Installeerbare app (alleen buiten de preview) */
try{ if("serviceWorker" in navigator && window.top===window && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
</script>
